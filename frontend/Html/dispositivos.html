<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis dispositivos - Tlapiani</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/dashboard.css">
</head>
<body>

<div class="sidebar">
    <h2>Tlapiani</h2>

    <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="dispositivos.html">Mis dispositivos</a></li>
        
    </ul>

    <div class="sidebar-user">
        <p>Usuario</p>
        <strong id="usuarioActivo">--</strong>

        <button id="btnLogout" class="logout-btn">
            Cerrar sesión
        </button>
    </div>
</div>

<div class="main-content">

    <div class="top-bar">
        <h1>Mis dispositivos</h1>
        <p>Registra o selecciona el dispositivo que quieres monitorear.</p>
    </div>

    <div class="row g-4">

        <div class="col-md-6">
            <div class="info-card">
                <h3>Registrar dispositivo</h3>

                <label>ID del dispositivo</label>
                <input id="deviceId" class="form-control mt-2 mb-3" type="text" placeholder="Ej. TLAPIANI-001">

                <label>Nombre del dispositivo</label>
                <input id="deviceName" class="form-control mt-2 mb-3" type="text" placeholder="Ej. Casa, escuela, prototipo">

                <button id="btnAgregarDispositivo" class="map-button">
                    Agregar dispositivo
                </button>

                <p id="mensajeDispositivo" class="mt-3"></p>
            </div>
        </div>

        <div class="col-md-6">
            <div class="info-card">
                <h3>Seleccionar dispositivo</h3>

                <div id="listaDispositivos">
                    <p>Aún no hay dispositivos registrados.</p>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="../js/auth.js"></script>
<script src="../js/dispositivos.js"></script>

</body>
</html>x
